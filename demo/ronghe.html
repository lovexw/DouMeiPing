<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拾光融合餐厅 · 门店工具演示 | 默默评价管理助手</title>
<meta name="description" content="拾光融合餐厅演示门店，融合菜行业专属好评词库体验，访问码 456">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/demo.css">
</head>
<body data-store="ronghe">

<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-icon" id="loginIcon"></div>
      <div class="name" id="loginBrand"></div>
      <div class="desc" id="loginDesc"></div>
      <a class="site" href="../index.html">默默评价管理助手 · 演示环境</a>
    </div>
    <input type="text" inputmode="numeric" class="login-input" id="codeInput" placeholder="请输入门店访问码" autocomplete="off">
    <button class="login-btn" id="btnLogin">进入系统</button>
    <div class="login-tip">
      演示访问码：<span class="highlight" id="loginTipCode"></span><br>
      输入即可体验生成、复制全流程
    </div>
    <div class="login-back"><a href="../index.html">← 返回首页查看全部演示门店</a></div>
  </div>
</div>

<!-- 主页面 -->
<div class="main-page" id="mainPage" hidden>
  <header class="brand-header">
    <div class="brand-icon" id="brandIcon"></div>
    <div>
      <div class="brand-name" id="brandName"></div>
      <div class="brand-desc" id="brandDesc"></div>
    </div>
  </header>

  <div class="style-tabs" id="styleTabs">
    <div class="style-tab active" data-style="normal">真实评价风</div>
    <div class="style-tab" data-style="xhs">小红书探店风</div>
  </div>

  <section class="card review-card">
    <div class="card-label">好评生成</div>
    <div class="review-text placeholder" id="reviewText">点击下方「随机生成」按钮，生成本店专属好评文案</div>
    <div class="review-meta" id="reviewMeta" hidden></div>
  </section>

  <div class="main-actions">
    <button class="btn btn-primary" id="btnGenerate">随机生成</button>
    <button class="btn btn-secondary" id="btnCopy">一键复制</button>
  </div>

  <section class="card wifi-card">
    <div class="card-label muted">门店温馨工具</div>
    <div class="wifi-row">
      <span class="wifi-label">门店名称</span>
      <span class="wifi-value" id="wifiName"></span>
    </div>
    <div class="wifi-row">
      <span class="wifi-label">WiFi 名称</span>
      <span class="wifi-value" id="wifiSsid"></span>
      <span class="wifi-copy" data-field="ssid">复制</span>
    </div>
    <div class="wifi-row">
      <span class="wifi-label">WiFi 密码</span>
      <span class="wifi-value" id="wifiPassword"></span>
      <span class="wifi-copy" data-field="password">复制</span>
    </div>
  </section>

  <section class="card qr-card">
    <div class="card-label">门店专属二维码</div>
    <div class="qr-wrap"><div id="qrBox"></div></div>
    <div class="qr-tip">顾客扫码直达本店工具页，二维码与当前访问地址实时对应</div>
    <div class="qr-url" id="qrUrl"></div>
    <span class="qr-refresh" id="qrRefresh">刷新二维码</span>
  </section>

  <footer class="demo-foot">
    <a href="../index.html">← 返回首页</a> · <a id="btnLogout">切换门店</a>
    <div class="foot-note">演示内容仅供体验 · 评价文案为参考模板，请基于真实消费体验确认后发布<br>© 2026 默默传媒 · 默默评价管理助手</div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script src="../assets/qrcode.js"></script>
<script src="../assets/demo.js"></script>
</body>
</html>
